name = "tg-autoreply-bot"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# ---------------------------------------------------------------------------
# 下面全部是可改的配置，改完 `npx wrangler deploy` 就生效，不用动代码。
# BOT_TOKEN / WEBHOOK_SECRET 不要写在这个文件里，用 secret 存：
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
# ---------------------------------------------------------------------------

[vars]

# 机器人的 @用户名（不带 @，例如 my_shop_bot）。填了就不用每次调 getMe，识别更快、更抗限流。
# 留空也可以，会自动调 getMe 拿。
BOT_USERNAME = "xibaozi_ccp_bot"

# 被 @ 之后回复的那「同一句话」。支持换行，注意别超过 Telegram 限制（纯文本 4096 字）。
REPLY_TEXT = """
给那些在 Telegram 上胡作非为、满世界乱窜的，一个个不知天高地厚、无法无天的家伙！朕在此郑重宣告：尔等区区网络刁民，妄图凭借那几块破砖头（翻墙）便能窥探朕的龙颜？简直是痴心妄想！尔等自诩躲在虚拟世界里便能高枕无忧，以为披上网络马甲就能为所欲为？哼！朕告诉尔等，在朕的天下，没有谁能轻易逃出朕的手掌心！

朕的臣民都给朕听好了！即日起，凡是在 Telegram 上造谣生事、散布谣言、恶意辱骂，甚至胆敢对朕指手画脚的家伙，都给朕好好掂量掂量自己的所作所为！朕一声令下，便要让网警严加看管！尔等若再敢有半点风吹草动，朕就让人把尔等的网线物理掐断，让尔等连自己的虚拟世界都进不去！还要让王小洪亲自上门，查查尔等的水表，看看是不是偷用了朕的电力来维持那该死的网络世界！

更让朕怒不可遏的是，尔等竟敢在背后议论朕，说什么朕不行、朕错了，简直是把朕的脸往地上踩！朕看尔等是活腻了，还是想尝尝梁家河挑麦子的滋味？朕命令尔等，立刻、马上，把那些乱七八糟的言论收起来！否则，朕就让党卫军连夜封杀尔等的账号，再发配边疆修路，让尔等知道什么叫人间地狱！

还有那些整日恶意开盒、泄露他人住址、电话号码、工作单位，甚至传播私密影像、煽动网络暴力的家伙，更是罪加一等！尔等竟敢把侵犯隐私当作本事，把伤害他人当作娱乐？简直荒唐至极！朕的天下岂容尔等如此胡作非为？网络不是尔等违法乱纪的护身符，匿名更不是免罪金牌！至于那些传播违法色情内容、拿他人隐私取乐的家伙，也都给朕好好反省！

尔等若真有本事，就把精力用在正经事情上，少搞那些见不得人的勾当！对于造谣、开盒、恶意骚扰等行为，朕定要严查到底，绝不容忍尔等继续把 Telegram 搞得乌烟瘴气！

这就是朕给尔等的最后通牒！尔等若还敢执迷不悟、肆意妄为，那就休怪朕无情无义，直接动用最高级别的网络防火墙，将尔等一网打尽！退下吧，莫要再惹朕龙颜大怒，烧坏了朕的龙袍！
"""

# 要发的图。三种写法：
#   1) 公网直链：https://...jpg
#   2) 相对路径：/meme.jpg —— 图放 public/ 里，会挂在这个 Worker 自己域名下（不用另找图床）
#   3) Telegram file_id（只在同一个 bot 下有效）
# 留空就只发文字。
IMAGE_URL = "/meme.jpg"

# 按钮。一维数组 = 每个按钮一行；二维数组 = 按行分组。
#   ["按钮A", "按钮B"]                  → 两行，各一个（点了回调）
#   [["按钮A", "按钮B"], ["按钮C"]]      → 第一行两个，第二行一个
# URL 按钮写法：[{"text": "打开链接", "url": "https://example.com"}]
BUTTONS = '["【一键封杀】", "【全网通缉】", "【祖宗查水表】", "【退朝禁言】", "【发配梁家河】", "【面壁思过】"]'

# 按钮点了之后弹的提示文字（CALLBACKS 里单独配的会覆盖这个）。留空 = 不弹。
CALLBACK_DEFAULT = ""

# 细粒度的按钮行为（可选）。key 是 callback_data（就是上面按钮的文字）：
# {"按钮 A": {"text": "弹窗提示", "alert": true},
#  "按钮 B": {"send": "再发一条详细内容给我"}}
CALLBACKS = '{"【一键封杀】": {"text": "网线物理掐断！", "alert": true}, "【全网通缉】": {"text": "王警官上门查水表！", "alert": true}, "【祖宗查水表】": {"text": "连你爹娘的网线都封！", "alert": true}, "【退朝禁言】": {"text": "敢说话就缝嘴！", "alert": true}, "【发配梁家河】": {"text": "挑二百斤麦子不许停！", "alert": true}, "【面壁思过】": {"text": "跪在御花园反省！", "alert": true}}'

# 同一个人同一个群，多少毫秒内只回一次（防刷屏）。0 = 不限流。
COOLDOWN_MS = "3000"

# public/ 里的文件直接挂在线上（GET /meme.jpg 就能拿到图），Telegram 那边才肯下。
# IMAGE_URL 写成 /xxx.jpg 时，代码会自动拼成 https://<你的 Worker 域名>/xxx.jpg。
[assets]
directory = "./public"

# 想让文案里用 <b> 之类的标签，就填 HTML（或 MarkdownV2）。留空 = 纯文本，最不容易报错。
# 现在文案里没有任何标签，保持纯文本最稳；以后要加粗再填 HTML，并记得把标签写上。
PARSE_MODE = ""
